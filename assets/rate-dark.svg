<line x1="1216.0" y1="60" x2="1216.0" y2="442"/>
</g>
<g stroke="#4b4a46" stroke-width="1.5"><line x1="340" y1="206" x2="1216" y2="206"/><line x1="340" y1="442" x2="1216" y2="442"/></g>
<path d="M340.0 206.0 H394.8 V171.0 H613.8 V136.0 H832.8 V101.0 H1051.8 V66.0 H1216.0" fill="none" stroke="#ecece8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
