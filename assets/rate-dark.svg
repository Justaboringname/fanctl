<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t">
<title id="t">Schematic. The energy counter steps up in batches every 2 s, each batch with its own hardware timestamp, while the app polls every 1 s. Energy delta divided by the poll interval alternates between 0 and 2x the real power; divided by the counter's own timestamp delta it stays at 1x.</title>
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.tx { fill: #ecece8; }
.mu { fill: #9b9a94; }
.clay { fill: #d97757; }
.sage { fill: #9bb07c; }
.eyebrow { font-size: 22px; letter-spacing: 4px; }
.title { font-weight: 700; letter-spacing: -1.5px; }
.tag { font-size: 28px; }
.node { font-size: 24px; font-weight: 600; }
.sub { font-size: 22px; }
.cap { font-size: 22px; }
.small { font-size: 20px; }
.num { font-variant-numeric: tabular-nums; }
.lab { font-size: 24px; font-weight: 600; }
.tick { font-size: 22px; font-variant-numeric: tabular-nums; }
</style>
